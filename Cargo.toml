[package]
name = "gauss-trainer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal trainer for the Gaussian algorithm (Gauss–Jordan elimination) with exact rational arithmetic"
license = "MIT"
readme = "README.md"
repository = "https://github.com/timur-manjosov/gauss-trainer"
keywords = ["linear-algebra", "gaussian-elimination", "tui", "education", "ratatui"]
categories = ["command-line-utilities", "mathematics", "education"]

[lib]
name = "gauss_trainer"
path = "src/lib.rs"

[[bin]]
name = "gauss-trainer"
path = "src/main.rs"

[dependencies]
# Exact arithmetic. `num-bigint` must stay on 0.4 to match the BigInt type used by num-rational 0.4.
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
ratatui = "0.30"
thiserror = "2"

[dev-dependencies]
insta = "1"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
